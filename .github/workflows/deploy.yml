name: Test and deploy

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m coverage run --rcfile=.coveragerc manage.py test
      - run: python -m coverage report --rcfile=.coveragerc

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production-deploy
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          fingerprint: ${{ secrets.VM_SSH_FINGERPRINT }}
          script: |
            set -e
            cd /opt/timeout
            git fetch origin main
            git reset --hard origin/main
            # Build with Docker's default builder, not another project's buildx builder on this VM.
            export BUILDX_BUILDER=default
            docker compose up -d --build
            docker image prune -f --filter label=project=timeout

      # The first deploy also seeds demo data, so allow several minutes.
      - name: Check the site responds
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 30 --retry-delay 10 --retry-all-errors
          https://timeout.ozankaya.net/
